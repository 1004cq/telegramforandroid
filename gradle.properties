## CQ Telegram Android — project-wide Gradle settings
## Upstream baseline: DrKLO/Telegram @ f32ffeec (13.0.2 / 7175)

# --- CQ application identity (matches https://me.cq.je/CQ.apk) ---
APP_VERSION_CODE=7175
APP_VERSION_NAME=13.0.2
APP_PACKAGE=je.cq.tg
IS_PRIVATE=false

# Signing: override in local.properties (never commit real secrets).
# Example local.properties keys:
#   RELEASE_STORE_FILE=../keystore/cq-release.keystore
#   RELEASE_STORE_PASSWORD=***
#   RELEASE_KEY_ALIAS=***
#   RELEASE_KEY_PASSWORD=***
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android

# --- Build performance ---
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.tooling.parallel=true

# --- Android / R8 ---
android.useAndroidX=true
# Jetifier adds build cost; keep until a clean build proves no legacy support-lib AARs remain.
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true

# CQ distribution: set true to build arm64-only APK (~40% smaller native libs).
# Default false preserves the afat (universal) APK that matches current me.cq.je/CQ.apk.
CQ_ARM64_ONLY=false
